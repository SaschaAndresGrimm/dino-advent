<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Oli &amp; Fabios Dino-Abenteuer</title>
<meta name="theme-color" content="#10241c">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Dino-Abenteuer">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; overscroll-behavior: none;
    touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent; }
  canvas { display: block; position: fixed; inset: 0; touch-action: none; }
  #nameBox { position: fixed; inset: 0; display: none; align-items: center; justify-content: center;
    background: rgba(0,0,0,.55); z-index: 10; font-family: "Trebuchet MS", system-ui, sans-serif; }
  #nameCard { background: #fff7e0; border: 5px solid #6b4a2b; border-radius: 24px; padding: 24px 28px;
    width: min(86vw, 520px); text-align: center; box-shadow: 0 10px 0 rgba(0,0,0,.3); }
  #nameLabel { font-size: 26px; font-weight: bold; color: #3b2410; margin-bottom: 16px; }
  #nameInput { font-size: 30px; padding: 10px 16px; border-radius: 14px; border: 3px solid #6b4a2b; width: 80%;
    text-align: center; font-weight: bold; outline: none; -webkit-user-select: text; user-select: text;
    font-family: inherit; }
  #nameOk { margin-top: 18px; font-size: 28px; font-weight: bold; padding: 12px 44px; border-radius: 40px;
    border: 3px solid rgba(0,0,0,.3); background: #f4b400; color: #2b1a00; font-family: inherit; }
  #nameBox.compact { align-items: flex-start; padding-top: 6px; box-sizing: border-box; }
  #nameBox.compact #nameCard { padding: 10px 18px 12px; width: min(92vw, 640px); border-width: 4px; box-shadow: 0 5px 0 rgba(0,0,0,.3); }
  #nameBox.compact #nameLabel { font-size: 20px; margin-bottom: 8px; }
  #nameBox.compact br { display: none; }
  #nameBox.compact #nameInput { font-size: 24px; padding: 6px 12px; width: 56%; vertical-align: middle; }
  #nameBox.compact #nameOk { margin: 0 0 0 12px; font-size: 22px; padding: 8px 26px; vertical-align: middle; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="nameBox">
  <div id="nameCard">
    <div id="nameLabel"></div>
    <input id="nameInput" maxlength="14" autocomplete="off" autocorrect="off" autocapitalize="words" spellcheck="false" enterkeyhint="done"><br>
    <button id="nameOk">OK!</button>
  </div>
</div>
<script src="game.js"></script>
<script>
  if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  }
</script>
</body>
</html>
